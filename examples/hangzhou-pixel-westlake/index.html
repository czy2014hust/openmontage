<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>像素版杭州·西湖夜游</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="./vendor/three.min.js"></script>
    <style>
      :root {
        --ground: #071220;
        --ink: #f4efe6;
        --gold: #ffb454;
        --font-display: Georgia, "Times New Roman", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #three-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      .hud {
        position: absolute;
        left: 64px;
        right: 64px;
        z-index: 2;
        color: var(--ink);
        font-family: var(--font-display);
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      #title-card {
        top: 120px;
      }
      #title-card h1 {
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.15;
      }
      #title-card p {
        margin-top: 18px;
        font-size: 28px;
        opacity: 0.78;
        letter-spacing: 0.18em;
      }
      #end-card {
        bottom: 140px;
        text-align: right;
      }
      #end-card span {
        display: inline-block;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: var(--gold);
        border-bottom: 1px solid rgba(255, 180, 84, 0.45);
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="three-layer" class="clip" data-start="0" data-duration="12" data-track-index="0"></canvas>

      <section id="title-card" class="clip hud" data-start="0" data-duration="12" data-track-index="1">
        <h1 id="title">像素版杭州</h1>
        <p id="subtitle">西湖夜游</p>
      </section>

      <section id="end-card" class="clip hud" data-start="0" data-duration="12" data-track-index="2">
        <span id="end-label">西 湖 · 雷 峰 塔</span>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#title",
        { opacity: 0, y: 36, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out" },
        0.15,
      );
      tl.fromTo(
        "#subtitle",
        { opacity: 0, y: 18 },
        { opacity: 0.78, y: 0, duration: 0.9, ease: "power2.out" },
        0.45,
      );
      tl.fromTo(
        "#end-label",
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 1.0, ease: "power2.out" },
        8.2,
      );
      tl.to("#title-card", { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 4.5);
      window.__timelines["main"] = tl;

      const W = 1080;
      const H = 1920;
      const DURATION = 12;

      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: false,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      // Pixel look via low-res render target
      const PIXEL_SCALE = 0.38;
      const rtW = Math.max(180, Math.floor(W * PIXEL_SCALE));
      const rtH = Math.max(320, Math.floor(H * PIXEL_SCALE));
      const renderTarget = new THREE.WebGLRenderTarget(rtW, rtH, {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        depthBuffer: true,
      });
      const pixelScene = new THREE.Scene();
      const pixelCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const pixelMat = new THREE.MeshBasicMaterial({ map: renderTarget.texture });
      if (pixelMat.map && THREE.SRGBColorSpace) pixelMat.map.colorSpace = THREE.SRGBColorSpace;
      const pixelQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), pixelMat);
      pixelScene.add(pixelQuad);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0b1c3a, 0.018);
      scene.background = new THREE.Color(0x0b1c3a);

      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 400);
      camera.position.set(18, 14, 28);

      // Lights
      scene.add(new THREE.HemisphereLight(0x8eb6ff, 0x1a120c, 0.55));
      const moon = new THREE.DirectionalLight(0xb8d4ff, 0.55);
      moon.position.set(-20, 40, -10);
      scene.add(moon);
      const warmKey = new THREE.PointLight(0xffb454, 55, 80, 2);
      warmKey.position.set(0, 8, 6);
      scene.add(warmKey);
      const lakeGlow = new THREE.PointLight(0x4fd0c0, 28, 90, 2);
      lakeGlow.position.set(0, 2, -4);
      scene.add(lakeGlow);

      const root = new THREE.Group();
      scene.add(root);

      function box(w, h, d, color, x, y, z, emissive, emissiveIntensity) {
        const mat = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.82,
          metalness: 0.05,
          emissive: emissive || 0x000000,
          emissiveIntensity: emissiveIntensity || 0,
          flatShading: true,
        });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y + h / 2, z);
        return mesh;
      }

      function addWindowGrid(group, ox, oy, oz, cols, rows, facing) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (((c + r) * 17) % 5 === 0) continue;
            const lit = ((c * 13 + r * 7) % 3) !== 0;
            const win = box(
              0.35,
              0.45,
              0.12,
              lit ? 0xffcf7a : 0x2a3344,
              ox + c * 0.7 - (cols - 1) * 0.35,
              oy + r * 0.75,
              oz,
              lit ? 0xffb454 : 0x000000,
              lit ? 1.4 : 0,
            );
            if (facing === "x") {
              win.rotation.y = Math.PI / 2;
            }
            group.add(win);
          }
        }
      }

      // West Lake water
      const waterGeo = new THREE.PlaneGeometry(90, 70, 1, 1);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x1f6f6a,
        roughness: 0.18,
        metalness: 0.55,
        flatShading: true,
      });
      const water = new THREE.Mesh(waterGeo, waterMat);
      water.rotation.x = -Math.PI / 2;
      water.position.set(0, 0.02, -6);
      root.add(water);

      // Shore ring
      const shore = box(96, 0.4, 78, 0x2d3a2f, 0, -0.2, -6);
      shore.scale.set(1, 1, 1);
      root.add(shore);

      // Broken Bridge (断桥) — arched white bridge
      const bridge = new THREE.Group();
      bridge.position.set(-2, 0, 8);
      for (let i = -4; i <= 4; i++) {
        const archH = 1.2 + Math.cos((i / 4) * Math.PI) * 1.6;
        bridge.add(box(1.1, archH, 2.2, 0xd9dee8, i * 1.15, 0, 0));
      }
      bridge.add(box(11, 0.35, 2.6, 0xe8edf5, 0, 2.5, 0));
      // lamp posts on bridge
      for (const x of [-4, -1.5, 1.5, 4]) {
        bridge.add(box(0.25, 1.8, 0.25, 0x5a4638, x, 2.7, 1.0));
        bridge.add(box(0.45, 0.35, 0.45, 0xffb454, x, 4.5, 1.0, 0xffb454, 2.2));
      }
      root.add(bridge);

      // Leifeng Pagoda (雷峰塔) — tiered tower
      const pagoda = new THREE.Group();
      pagoda.position.set(10, 0, -8);
      const tiers = [
        { w: 5.2, h: 2.2, y: 0, color: 0x8b3a2a },
        { w: 4.4, h: 2.0, y: 2.2, color: 0x7a3426 },
        { w: 3.6, h: 1.9, y: 4.2, color: 0x8b3a2a },
        { w: 2.8, h: 1.8, y: 6.1, color: 0x6e2e22 },
        { w: 2.0, h: 1.6, y: 7.9, color: 0x8b3a2a },
        { w: 1.2, h: 1.4, y: 9.5, color: 0x5c261c },
      ];
      tiers.forEach((t, i) => {
        pagoda.add(box(t.w, t.h, t.w, t.color, 0, t.y, 0));
        pagoda.add(box(t.w + 1.1, 0.28, t.w + 1.1, 0xc9a46a, 0, t.y + t.h - 0.05, 0, 0xffb454, 0.35));
        if (i > 0) {
          addWindowGrid(pagoda, 0, t.y + 0.4, t.w / 2 + 0.05, 3, 1, "z");
        }
      });
      pagoda.add(box(0.35, 2.2, 0.35, 0xd4af37, 0, 11.0, 0, 0xffd27a, 1.5));
      root.add(pagoda);

      // Three Pools marker (三潭) — three small stone towers in water
      for (let i = 0; i < 3; i++) {
        const tx = -8 + i * 2.2;
        const tz = -14;
        root.add(box(0.9, 1.6, 0.9, 0x8a8f98, tx, 0, tz));
        root.add(box(0.35, 0.9, 0.35, 0xffcf7a, tx, 1.6, tz, 0xffb454, 2.0));
      }

      // Hefang Street block (河坊街) — dense low buildings
      const street = new THREE.Group();
      street.position.set(-14, 0, 2);
      for (let i = 0; i < 8; i++) {
        const h = 3 + ((i * 3) % 4);
        const b = box(2.2, h, 2.4, i % 2 ? 0x6b4e3d : 0x5a4638, i * 2.5, 0, (i % 2) * 1.2 - 0.6);
        street.add(b);
        street.add(box(2.6, 0.35, 2.8, 0x3d2a22, i * 2.5, h, (i % 2) * 1.2 - 0.6));
        addWindowGrid(street, i * 2.5, 0.8, (i % 2) * 1.2 + 0.7, 2, Math.max(2, Math.floor(h / 1.2)), "z");
      }
      // street lanterns
      for (let i = 0; i < 5; i++) {
        street.add(box(0.2, 2.4, 0.2, 0x3a2a20, i * 3.5 + 1, 0, 3.2));
        street.add(box(0.7, 0.55, 0.7, 0xff9f3c, i * 3.5 + 1, 2.4, 3.2, 0xffb454, 2.4));
      }
      root.add(street);

      // Distant modern skyline suggestion (钱江)
      const skyline = new THREE.Group();
      skyline.position.set(18, 0, -28);
      const heights = [8, 14, 11, 18, 9, 16, 12];
      heights.forEach((h, i) => {
        skyline.add(box(2.4, h, 2.4, 0x2a3348, i * 3.2 - 10, 0, (i % 3) * 2));
        addWindowGrid(skyline, i * 3.2 - 10, 1.2, (i % 3) * 2 + 1.3, 2, Math.floor(h / 1.1), "z");
      });
      root.add(skyline);

      // Willow suggestion — vertical green stacks along shore
      for (let i = 0; i < 10; i++) {
        const wx = -22 + i * 4.5;
        const wz = 14 + (i % 3) * 1.5;
        root.add(box(0.35, 4.5, 0.35, 0x3d2a1c, wx, 0, wz));
        root.add(box(2.2, 2.4, 2.2, 0x2f5d3a, wx, 3.2, wz, 0x1f6f3a, 0.15));
      }

      // Tiny people dots on bridge / shore
      for (let i = 0; i < 24; i++) {
        const px = -6 + (i % 12) * 1.1 + ((i * 5) % 7) * 0.05;
        const pz = 7.2 + ((i * 3) % 5) * 0.25;
        root.add(box(0.28, 0.7, 0.28, 0xff8f6b, px, 2.85, pz, 0xffcf7a, 0.4));
      }

      // Stars (deterministic hash — no Math.random)
      function hash01(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      const starGeo = new THREE.BufferGeometry();
      const starCount = 180;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPos[i * 3] = hash01(i + 1.1) * 120 - 60;
        starPos[i * 3 + 1] = 25 + hash01(i + 2.3) * 40;
        starPos[i * 3 + 2] = hash01(i + 3.7) * 120 - 80;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      const stars = new THREE.Points(
        starGeo,
        new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true }),
      );
      scene.add(stars);

      function camPath(t) {
        // Continuous dolly: wide lake approach -> bridge skim -> pagoda orbit -> pull back
        const u = Math.min(1, Math.max(0, t / DURATION));
        const ease = u * u * (3 - 2 * u);
        const a = {
          x: 22,
          y: 16,
          z: 30,
          tx: 2,
          ty: 3,
          tz: -2,
        };
        const b = {
          x: 2,
          y: 7,
          z: 18,
          tx: 0,
          ty: 2.5,
          tz: 6,
        };
        const c = {
          x: -6,
          y: 9,
          z: 4,
          tx: 10,
          ty: 6,
          tz: -8,
        };
        const d = {
          x: 16,
          y: 13,
          z: 10,
          tx: 6,
          ty: 5,
          tz: -10,
        };

        let p0 = a;
        let p1 = b;
        let local = ease;
        if (ease < 0.33) {
          local = ease / 0.33;
          p0 = a;
          p1 = b;
        } else if (ease < 0.66) {
          local = (ease - 0.33) / 0.33;
          p0 = b;
          p1 = c;
        } else {
          local = (ease - 0.66) / 0.34;
          p0 = c;
          p1 = d;
        }
        const s = local * local * (3 - 2 * local);
        return {
          x: p0.x + (p1.x - p0.x) * s,
          y: p0.y + (p1.y - p0.y) * s,
          z: p0.z + (p1.z - p0.z) * s,
          tx: p0.tx + (p1.tx - p0.tx) * s,
          ty: p0.ty + (p1.ty - p0.ty) * s,
          tz: p0.tz + (p1.tz - p0.tz) * s,
        };
      }

      function renderAt(time) {
        const t = Math.max(0, Math.min(DURATION, time));
        const p = camPath(t);
        camera.position.set(p.x, p.y, p.z);
        camera.lookAt(p.tx, p.ty, p.tz);

        // subtle water shimmer via emissive pulse (deterministic)
        waterMat.emissive = new THREE.Color(0x0a3a38);
        waterMat.emissiveIntensity = 0.15 + Math.sin(t * 1.7) * 0.05;
        warmKey.intensity = 50 + Math.sin(t * 2.1) * 6;
        stars.rotation.y = t * 0.01;

        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(pixelScene, pixelCam);
      }

      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        if (window.__timelines && window.__timelines.main) {
          window.__timelines.main.seek(time);
        }
        renderAt(time);
      });

      renderAt(window.__hfThreeTime || 0);
      tl.seek(0);
    </script>
  </body>
</html>
